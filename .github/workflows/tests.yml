# HabotConnect LSA Service Booking Backend

**Candidate:** Prince Yadav  
**Position:** Python Backend Developer  
**Project:** HabotConnect LSA Service Booking Backend

## 1. Project Overview

This project is a Django REST Framework backend prototype for HabotConnect.

The system connects parents with Learning Support Assistants (LSAs) and provides APIs for:

- LSA search by skills
- LSA availability filtering
- Service booking
- Overlapping booking prevention
- Mock payment processing
- Payment status updates
- Automated testing
- Continuous Integration using GitHub Actions

## 2. Technology Stack

- Python 3.13
- Django 6.1
- Django REST Framework
- SQLite
- Requests
- GitHub Actions

